name: PhpNitro Demo
description: Démo du framework — écrans, widgets, capacités device, backend unifié
version: 1.0.0
php: ">=8.1"

# Chaque gateway déclare le(s) nom(s) de variable(s) d'environnement qu'il
# attend dans .env — `phpx payments` lit ce fichier et dit lesquels sont
# réellement configurés, sans jamais lire les clés elles-mêmes.
payments:
    kkiapay:
        public_key_env: KKIAPAY_PUBLIC_KEY
        secret_key_env: KKIAPAY_PRIVATE_KEY
    stripe:
        public_key_env: STRIPE_PUBLIC_KEY
        secret_key_env: STRIPE_SECRET_KEY
    paypal:
        public_key_env: PAYPAL_CLIENT_ID
        secret_key_env: PAYPAL_CLIENT_SECRET
    fedapay:
        public_key_env: FEDAPAY_PUBLIC_KEY
        secret_key_env: FEDAPAY_SECRET_KEY
    feexpay:
        public_key_env: FEEXPAY_SHOP_ID
        secret_key_env: FEEXPAY_API_KEY
    izichangepay:
        public_key_env: IZICHANGEPAY_API_KEY
        secret_key_env: IZICHANGEPAY_API_SECRET
    tresorpay:
        public_key_env: TRESORPAY_PUBLIC_KEY
        secret_key_env: TRESORPAY_SECRET_KEY
