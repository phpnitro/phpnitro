name: PhpNitro Demo
description: Démo du framework — écrans, widgets, capacités device, backend unifié
# Convention identique à pubspec.yaml de Flutter : "1.0.0+3" = versionName/
# CFBundleShortVersionString "1.0.0" + versionCode/CFBundleVersion 3 (le
# "+N" est optionnel, vaut 1 par défaut). Seule source de vérité — édite
# ce champ, pas android/app/build.gradle.kts ni ios/App/Info.plist
# directement. `phpx bundle:android` (donc `phpx build:android` aussi) le
# synchronise automatiquement avant chaque vrai build ; `phpx sync` fait
# de même pour Android + iOS à la demande (utile avant d'ouvrir Xcode,
# qui n'a pas de commande phpx équivalente pour l'instant).
version: 1.0.0
php: ">=8.1"

# Décommente pour générer l'icône Android (mipmaps + icône adaptative)
# depuis `phpx bundle:android` — voir bin/generate-android-icon.php et
# `phpx icon` pour une régénération à la demande. `name` ci-dessus pilote
# aussi le label natif de l'app (strings.xml), en plus de .env's APP_NAME.
# icon: assets/icon.png
# icon_background: "#2563EB"

# Chaque gateway déclare le(s) nom(s) de variable(s) d'environnement qu'il
# attend dans .env — `phpx payments` lit ce fichier et dit lesquels sont
# réellement configurés, sans jamais lire les clés elles-mêmes.
payments:
    kkiapay:
        public_key_env: KKIAPAY_PUBLIC_KEY
        secret_key_env: KKIAPAY_PRIVATE_KEY
    stripe:
        public_key_env: STRIPE_PUBLIC_KEY
        secret_key_env: STRIPE_SECRET_KEY
    paypal:
        public_key_env: PAYPAL_CLIENT_ID
        secret_key_env: PAYPAL_CLIENT_SECRET
    fedapay:
        public_key_env: FEDAPAY_PUBLIC_KEY
        secret_key_env: FEDAPAY_SECRET_KEY
    feexpay:
        public_key_env: FEEXPAY_SHOP_ID
        secret_key_env: FEEXPAY_API_KEY
    razorpay:
        public_key_env: RAZORPAY_API_KEY
        secret_key_env: RAZORPAY_SECRET_KEY
    izichangepay:
        public_key_env: IZICHANGEPAY_API_KEY
        secret_key_env: IZICHANGEPAY_API_SECRET
    tresorpay:
        public_key_env: TRESORPAY_PUBLIC_KEY
        secret_key_env: TRESORPAY_SECRET_KEY

# Engine\Maps\MapView::make() choisit le premier fournisseur configuré ici ;
# OpenStreetMap n'a pas besoin d'entrée, c'est le repli toujours disponible
# sans clé (voir `phpx maps`).
maps:
    mapbox:
        access_token_env: MAPBOX_ACCESS_TOKEN
    google:
        api_key_env: GOOGLE_MAPS_API_KEY

# Engine\Firebase\ (voir packages/firebase/src/) — service_account_env sert
# à FirebaseMessaging (envoi de push, à exécuter depuis ton propre serveur,
# jamais depuis le PHP embarqué sur le téléphone) et Firestore ;
# web_api_key_env sert à FirebaseAuth (connexion des utilisateurs finaux,
# une clé distincte et client-safe par conception, pas le compte de
# service). Voir `phpx firebase`.
firebase:
    service_account_env: FIREBASE_SERVICE_ACCOUNT_JSON
    project_id_env: FIREBASE_PROJECT_ID
    web_api_key_env: FIREBASE_WEB_API_KEY
