name: PhpNitro Demo
description: Démo du framework — écrans, widgets, capacités device, backend unifié
# Convention identique à pubspec.yaml de Flutter : "1.0.0+3" = versionName/
# CFBundleShortVersionString "1.0.0" + versionCode/CFBundleVersion 3 (le
# "+N" est optionnel, vaut 1 par défaut). Seule source de vérité — édite
# ce champ, pas android/app/build.gradle.kts ni ios/App/Info.plist
# directement. `phpx bundle:android` (donc `phpx build:android` aussi) le
# synchronise automatiquement avant chaque vrai build ; `phpx sync` fait
# de même pour Android + iOS à la demande (utile avant d'ouvrir Xcode,
# qui n'a pas de commande phpx équivalente pour l'instant).
version: 1.0.0
php: ">=8.1"

# Décommente pour générer l'icône Android (mipmaps + icône adaptative)
# depuis `phpx bundle:android` — voir bin/generate-android-icon.php et
# `phpx icon` pour une régénération à la demande. `name` ci-dessus pilote
# aussi le label natif de l'app (strings.xml), en plus de .env's APP_NAME.
# icon: assets/icon.png
# icon_background: "#2563EB"

# Juste les noms des gateways que ce projet utilise — pas où sont leurs
# clés. Chaque gateway a déjà un nom de variable fixe défini une seule
# fois par le framework (voir bin/phpx's paymentGatewayEnvVars()), par
# exemple STRIPE_PUBLIC_KEY/STRIPE_SECRET_KEY pour stripe — mets les
# vraies valeurs dans .env sous ces noms-là, rien à redéclarer ici.
# `phpx payments` dit lesquels sont réellement configurés, sans jamais
# lire les clés elles-mêmes.
payments: [stripe, fedapay, paypal, razorpay, paydunya]

# Même principe que payments ci-dessus — voir bin/phpx's
# mapProviderEnvVars() pour les noms de variable fixes
# (MAPBOX_ACCESS_TOKEN, GOOGLE_MAPS_API_KEY). OpenStreetMap n'a pas
# besoin d'entrée, c'est le repli toujours disponible sans clé (voir
# `phpx maps`). Actuellement mort côté rendu natif : Engine\Native\
# MapView (osmdroid) n'a besoin d'aucune clé et ignore cette section —
# seule `phpx maps` la lit, pour un usage direct de l'API REST d'un
# fournisseur en dehors du rendu de carte intégré.
maps: []

# Un seul projet Firebase possible par projet PhpNitro (contrairement à
# payments/maps, qui listent plusieurs fournisseurs) — juste true/false.
# Noms de variable fixes (voir cmdFirebase() dans bin/phpx) :
# FIREBASE_SERVICE_ACCOUNT_JSON (FirebaseMessaging + Firestore),
# FIREBASE_PROJECT_ID, FIREBASE_WEB_API_KEY (FirebaseAuth). Voir
# `phpx firebase`.
firebase: false
