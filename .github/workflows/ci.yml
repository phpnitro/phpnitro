name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  phpunit:
    name: PHPUnit (all packages/*/tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, pdo_sqlite
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: vendor/bin/phpunit

  phpx-smoke-test:
    name: bin/test.sh (phpx smoke test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, pdo_sqlite
          coverage: none
      - run: bash bin/test.sh

  phpstan:
    name: PHPStan (static analysis)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, pdo_sqlite
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: vendor/bin/phpstan analyse

  android-build:
    name: Android APK (assembleDebug)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, pdo_sqlite
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # jniLibs (libphp.so / libsqlite3.so, ~30MB) are committed as-is —
      # see android/README.md — so this is a real APK, native runtime included.
      - run: php bin/phpx bundle:android
      # rust/phpnitro-render, cross-compiled for the same 2 ABIs libphp.so
      # already ships (arm64-v8a/armeabi-v7a — no x86_64 device exists, so
      # neither does this), placed directly into
      # android/engine/src/main/jniLibs/<abi>/ where Gradle's own jniLibs
      # packaging already looks (see android/engine/build.gradle.kts).
      # Unlike libphp.so, this .so is never committed to git — it's cheap
      # to rebuild fresh every CI run (a few Cargo crates, not a whole
      # cross-compiled PHP interpreter), so there is no binary blob to
      # keep in sync here.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/phpnitro-render
      - run: cargo install cargo-ndk --locked
      - run: cargo ndk -t arm64-v8a -t armeabi-v7a -o ../../android/engine/src/main/jniLibs build --release
        working-directory: rust/phpnitro-render
      # Pinned explicitly: this project has no Gradle wrapper (bin/phpx's
      # own resolveOrInstallGradle() plays that role locally), so without
      # this the action would just use whatever `gradle` happens to be
      # pre-installed on the runner image — no guarantee it satisfies AGP
      # 9.0.1's Gradle >= 9.1.0 requirement. Keep in sync with
      # resolveOrInstallGradle()'s $pinnedVersion in bin/phpx.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'
      - run: cd android && gradle :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

  android-e2e-test:
    name: Android E2E (real emulator, android/app/src/androidTest)
    # DISABLED FOR NOW — remove this `if` line to re-enable, once the
    # account's GitHub billing/spending limit is sorted (Settings >
    # Billing and plans). Real root cause, confirmed by a real CI run's
    # own QEMU output — "HVF error: HV_UNSUPPORTED" / "qemu-system-
    # aarch64-headless: failed to initialize HVF: Invalid argument" —
    # is that GitHub's STANDARD macos-14 runner doesn't expose nested
    # virtualization (HVF) to the VM it hands out, so the emulator's own
    # hypervisor init crashes before any emulator-options tuning could
    # ever matter; only the larger `macos-14-xlarge` tier does. That tier
    # is billed at a higher per-minute rate, and this account's own job
    # run came back with "The job was not started because recent account
    # payments have failed or your spending limit needs to be increased"
    # — a GitHub account setting, not anything fixable from workflow code.
    if: false
    # macos-14 (Apple Silicon, ARM64) is required, not ubuntu-latest —
    # android/README.md documents only armeabi-v7a/arm64-v8a builds of
    # libphp.so exist (no x86_64), so a standard Linux runner's x86_64
    # emulator would boot the app straight into "PHP binary not found".
    # An ARM64 system image on Apple Silicon gets real HVF hardware
    # acceleration; the same arch on an Intel/AMD runner would fall back
    # to software emulation, slow enough to blow past any reasonable CI
    # timeout. -xlarge specifically (not plain macos-14): see the `if:
    # false` comment above for why plain macos-14 can never work here.
    runs-on: macos-14-xlarge
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, pdo_sqlite
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: php bin/phpx bundle:android
      # Pinned explicitly: this project has no Gradle wrapper (bin/phpx's
      # own resolveOrInstallGradle() plays that role locally), so without
      # this the action would just use whatever `gradle` happens to be
      # pre-installed on the runner image — no guarantee it satisfies AGP
      # 9.0.1's Gradle >= 9.1.0 requirement. Keep in sync with
      # resolveOrInstallGradle()'s $pinnedVersion in bin/phpx.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'
      # connectedDebugAndroidTest builds+installs both the app APK and the
      # test APK itself — no separate assembleDebug needed first. Only
      # NativeUiE2ETest.kt's non-@Ignore()'d tests actually run; the two
      # @Ignore()'d ones (drag-to-reorder, horizontal scroll) stay skipped
      # for the documented reason in their own annotations, not silently
      # dropped.
      - name: Run instrumented E2E tests on a real arm64-v8a emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: arm64-v8a
          target: google_apis
          profile: pixel_6
          disable-animations: true
          # A previous theory blamed `-gpu swiftshader_indirect` for the
          # emulator never binding port 5554 and reverted to this
          # action's own default emulator-options — WRONG, disproven by
          # a real CI run's own log: the actual launch command still
          # included `-gpu swiftshader_indirect` regardless (it's this
          # action's DEFAULT, not something the earlier custom
          # `emulator-options:` line was uniquely responsible for), and
          # the real crash was `runs-on`'s runner tier the whole time
          # (see its own comment above) — QEMU's HVF init failing, logged
          # several lines before adb ever gets involved. The boot-timeout
          # bump stays; it's still a strictly additive safety margin.
          emulator-boot-timeout: 900
          script: cd android && gradle :app:connectedDebugAndroidTest

  linux-desktop:
    name: Linux desktop (GTK4/Cairo, python3 -m unittest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, pdo_sqlite
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      # PyGObject/pycairo are system packages tied to the OS's own GTK
      # build (not pip-installable in any portable way) — see
      # linux/README.md.
      - run: sudo apt-get update && sudo apt-get install -y python3-gi python3-gi-cairo gir1.2-gtk-4.0 gir1.2-shumate-1.0 librlottie0-1 xvfb
      # Phase 2 proof-of-concept (rust/phpnitro-render/README.md):
      # test_rust_render_parity.py compares this Cairo path's own output
      # against the new Rust core's, pixel by pixel, on real fixtures —
      # it self-skips cleanly if this build step is ever missing, but
      # building it here means CI actually exercises that comparison
      # instead of silently skipping it every run.
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/phpnitro-render
      - run: cargo build --release --locked
        working-directory: rust/phpnitro-render
      # Confirmed by a real CI run: running with NO display backend at
      # all (not even Xvfb) segfaulted partway through
      # test_app_widget.py's animation-timer test — a real, reproducible
      # crash in CI, even though the exact same suite ran clean, many
      # times, in the sandbox this target was originally written in
      # (which also has no Xvfb — see linux/README.md). The two
      # environments' GTK4/PyGObject package versions aren't identical,
      # so the honest state is: root-caused to "no display at all is an
      # unsupported GTK4 configuration that's unstable in at least one
      # of these two environments," not nailed down further than that.
      # xvfb-run was already a dependency for the smoke test below;
      # wrapping the whole suite in it is the same real (virtual)
      # display every actual Linux desktop this app would ever run on
      # already has — the crash-free configuration, not a workaround
      # papering over one.
      - run: xvfb-run -a python3 -m unittest discover -s linux/tests -v
      # The one thing that could never be checked without a real display
      # server (none available in the environment this target was
      # originally written in — see linux/README.md's own note on that):
      # does a real Gtk.Application + Gtk.ApplicationWindow actually
      # come up at all, end to end, against this repo's own real PHP
      # server. xvfb-run supplies a virtual X server so this is a REAL
      # window, not a mock — just an invisible one.
      - name: Real windowed smoke test (Xvfb) — app launches and stays alive
        working-directory: linux
        run: |
          set -e
          xvfb-run -a python3 -m phpnitro_desktop .. --screen home &
          APP_PID=$!
          sleep 5
          if ! kill -0 "$APP_PID" 2>/dev/null; then
            echo "::error::phpnitro_desktop exited/crashed within 5s of launch instead of staying open"
            exit 1
          fi
          echo "phpnitro_desktop is alive after 5s (PID $APP_PID) — real window + real PHP fetch didn't crash"
          kill "$APP_PID"
          wait "$APP_PID" 2>/dev/null || true

  ios-build:
    name: iOS Swift package (xcodebuild, PhpNitroNativeEngine)
    # No .xcodeproj is committed — Xcode has built raw SPM packages
    # directly by scheme name since Xcode 11, so `xcodebuild -scheme
    # <target>` against a bare Package.swift works with nothing to
    # generate first. See ios/README.md: PhpNitroWebViewBridge (the
    # older WKWebView fallback path) and PhpNitroNativeEngine (this
    # framework's actual primary render pipeline, ported for the first
    # time here) are two separate targets — this job builds+tests the
    # one with real unit tests today; PhpNitroWebViewBridge has none yet
    # (it has never run against a real WKWebView either, see its own
    # docblocks), so it's built here (catches compile errors) but not
    # tested.
    runs-on: macos-14
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4
      # rust/phpnitro-render cross-compiled for the iOS SIMULATOR target
      # (aarch64-apple-ios-sim — this runner is Apple Silicon, so its
      # simulator runs the arm64 slice, not x86_64; see ios/Package.swift's
      # own comment for the full reasoning). RustNativeRenderer's linker
      # flags expect this exact target/aarch64-apple-ios-sim/release/ path
      # to exist before xcodebuild links anything against it.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/phpnitro-render
      - run: cargo build --release --target aarch64-apple-ios-sim --locked
        working-directory: rust/phpnitro-render
      - run: xcodebuild -scheme PhpNitroWebViewBridge -destination 'generic/platform=iOS Simulator' build
      - run: xcodebuild -scheme RustNativeRenderer -destination 'generic/platform=iOS Simulator' build
      # Confirmed by a real CI run's `xcodebuild -list` output (three
      # wrong guesses before this one — "PhpNitroNativeEngine" exists but
      # isn't wired for the Test action; bare "PhpNitroEngine" doesn't
      # exist as a scheme at all; "PhpNitroNativeEngineTests" doesn't
      # either): Xcode's actual auto-generated schemes for this package
      # are "PhpNitroEngine-Package", "PhpNitroNativeEngine", and
      # "PhpNitroWebViewBridge" — the package-level aggregate scheme
      # (which IS wired for Test, running every test target including
      # PhpNitroNativeEngineTests) gets a "-Package" suffix Xcode never
      # documents up front, it only shows up in -list's real output. A
      # 5th product (RustNativeRenderer) was added without re-confirming
      # this via -list again — the same aggregate-scheme mechanism that
      # already covers 4 products should cover 5, but if this job starts
      # failing with a scheme-not-found error, check a fresh `xcodebuild
      # -list` output first rather than guessing again.
      - run: xcodebuild -scheme PhpNitroEngine-Package -destination 'platform=iOS Simulator,name=iPhone 15' test

  macos-build:
    name: macOS Swift package (xcodebuild, PhpNitroMacEngine)
    # A genuinely SEPARATE package from ios/ (macos/Package.swift, with a
    # local path dependency on ios/'s own PhpNitroProtocol product) — see
    # that manifest's own docblock for why: ios/'s aggregate `-Package`
    # scheme (the one wired for the Test action, per ios-build's own
    # comment above) would try to build EVERY target in that package for
    # macOS, including UIKit-only ones, and fail. A separate package
    # means this job can never touch iOS-only code at all.
    runs-on: macos-14
    defaults:
      run:
        working-directory: macos
    steps:
      - uses: actions/checkout@v4
      # Homebrew is preinstalled on GitHub's macOS runners — this
      # downloads over GitHub's own network (the CI runner's), never the
      # machine that queued this workflow. Needed for
      # MacPhpProcessTests' real spawn-a-server integration test (mirrors
      # linux/tests/test_php_process.py's own real `php -S` test); that
      # specific test skips itself gracefully (XCTSkip) if this step
      # were ever removed or `php` weren't actually on PATH afterward,
      # so this isn't a hard requirement for the rest of the suite.
      - run: brew install php
      # rust/phpnitro-render, compiled NATIVELY for this runner's own
      # macOS/arm64 host (no cross-compilation toolchain needed at all —
      # unlike Android/iOS, this CI runner's own architecture already IS
      # the target). RustMacRenderer's linker flags (see macos/Package.swift's
      # own #filePath-computed rustReleaseDir) expect this exact
      # target/release/ path to exist before xcodebuild links anything
      # against it.
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/phpnitro-render
      - run: cargo build --release --locked
        working-directory: rust/phpnitro-render
      # This package's scheme names have never been confirmed against a
      # real `xcodebuild -list` since RustMacRenderer/CPhpNitroRender were
      # added — logged up front specifically so a wrong guess below is a
      # two-second diagnosis from the log instead of a mystery. This
      # package now has 2 products (PhpNitroMacEngine, RustMacRenderer),
      # not 1 — per ios-build's own precedent (4 products there), Xcode
      # is therefore expected to generate a "PhpNitroMacEngine-Package"
      # aggregate scheme (wired for the Test action) alongside per-target
      # build-only ones, NOT keep the old single-scheme-no-suffix
      # behavior this job's previous comment (see git history) documented
      # for the 1-product package that existed before this commit.
      - run: xcodebuild -list
      - run: xcodebuild -scheme PhpNitroMacEngine -destination 'platform=macOS' build
      - run: xcodebuild -scheme RustMacRenderer -destination 'platform=macOS' build
      # PhpNitroMacApp — the real, runnable NSApplication (Sources/PhpNitroMacApp/)
      # that finally drives RustMacRenderer end to end on screen, not just
      # in RustMacRendererTests' offscreen pixel checks. Build only, same
      # honest limit as every other platform: no display server in CI to
      # actually click a real window.
      - run: xcodebuild -scheme PhpNitroMacApp -destination 'platform=macOS' build
      - run: xcodebuild -scheme PhpNitroMacEngine-Package -destination 'platform=macOS' test

  windows-desktop-protocol:
    name: Windows desktop protocol layer (dotnet test)
    # Runs on ubuntu-latest, deliberately — windows/PhpNitroDesktop.Protocol
    # targets plain net8.0, no Windows-specific API anywhere in it (see
    # windows/README.md for the full reasoning: no .NET/C# toolchain was
    # available while writing this, so only the platform-agnostic slice
    # was attempted at all, mirroring ios/'s own PhpNitroProtocol). This
    # job running at all, on Linux, is real proof of that claim — not
    # just a comment saying so.
    #
    # PhpNitroDesktop.Render (P/Invoke bindings for rust/phpnitro-render's
    # C ABI) is the same story one level deeper: .NET's DllImport
    # resolution is itself cross-platform, so running its tests here
    # against the Linux-built libphpnitro_render.so is real evidence the
    # same C# code would resolve phpnitro_render.dll on an actual Windows
    # machine too — not just an untested claim, the same rigor as the
    # Protocol layer above.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, pdo_sqlite
          coverage: none
      - run: composer install --no-interaction --prefer-dist
        working-directory: .
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/phpnitro-render
      - run: cargo build --release --locked
        working-directory: rust/phpnitro-render
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet test PhpNitroDesktop.Protocol.Tests --verbosity normal
      - run: dotnet test PhpNitroDesktop.Render.Tests --verbosity normal

  windows-desktop-app:
    name: Windows desktop app (WinForms, dotnet build)
    # A REAL windows-latest runner — the first job in this whole file that
    # needs one. PhpNitroDesktop.App is the first project in windows/ that
    # isn't OS-agnostic: it targets net8.0-windows + UseWindowsForms, which
    # can only ever build on an actual Windows machine (or this runner).
    # Build only, not run — same honest limit every other platform's CI
    # already has (no display server anywhere in CI to click a real
    # window), so this proves the app compiles/links against the Rust
    # engine's real Windows build, not that it visually renders correctly.
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/phpnitro-render
      - run: cargo build --release --locked
        working-directory: rust/phpnitro-render
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet build PhpNitroDesktop.App --configuration Release

  rust-render-core:
    name: Rust shared render core (cargo test, phpnitro-render)
    # rust/phpnitro-render is the future single rendering engine meant to
    # replace the 4 separately-written native renderers (Android/iOS+macOS/
    # Linux/Windows) — see rust/phpnitro-render/README.md. This job only
    # exercises the crate itself (protocol decoding, rasterization, hit-
    # testing, animation math) offscreen via tiny-skia's Pixmap, the same
    # no-display-server approach linux/tests already uses with Cairo's
    # ImageSurface — unlike the linux-desktop job below, this one needs no
    # Xvfb at all, since nothing here ever opens a real window.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust/phpnitro-render
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/phpnitro-render
      - run: cargo test --locked --verbose

  rust-render-android-jni:
    name: Rust JNI bridge compiles for Android (aarch64, no Gradle)
    # A fast, isolated signal deliberately separate from android-build's
    # full `gradle :app:assembleDebug` below: this job only proves
    # src/jni_bridge.rs's types line up against the real `jni` crate for
    # a real Android target triple — nothing about Gradle, NDK linker
    # configuration, or the Kotlin side. If this job is red, the problem
    # is definitely in jni_bridge.rs itself, not the (much larger, much
    # slower to iterate on) Android app build.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust/phpnitro-render
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/phpnitro-render
      # GitHub's ubuntu-latest runner images are documented to bundle an
      # Android SDK+NDK already (ANDROID_NDK_HOME set) — logged
      # defensively rather than assumed, same "confirm before relying on
      # it" discipline this project already used for Xcode scheme names.
      # cargo-ndk (not a hand-written .cargo/config.toml linker path)
      # discovers that NDK and wires the correct clang linker for the
      # target itself — the standard tool for this, not reinvented here.
      - run: echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME" && ls "$ANDROID_NDK_HOME"
      - run: cargo install cargo-ndk --locked
      - run: cargo ndk -t arm64-v8a build --release

  ios-php-embed-step1:
    name: "iOS PHP embed — step 1: cross-compile libphp.a (experimental)"
    # Step 1 of a deliberately incremental, CI-observed attempt at real
    # on-device PHP for iOS (see ios/Sources/PhpNitroWebViewBridge/
    # PhpEmbedBridge.swift's own TODOs and ios/README.md: Android embeds
    # PHP as a genuine `php -S` SUBPROCESS via a cross-compiled libphp.so
    # — a model that cannot port to iOS at all, since Process/NSTask
    # doesn't exist there under the app sandbox. The actual iOS path has
    # to be PHP's embed SAPI (--enable-embed=static) linked directly
    # in-process, called via a thin C bridge — genuinely never attempted
    # in this repo before, unlike every other native capability here.
    # This job answers exactly one question — does php-src's own
    # ./configure + make even produce a libphp.a when cross-compiled
    # against the iOS SDK sysroot on this runner's toolchain — and
    # nothing else: no linking into a Swift target yet (that's step 2+),
    # no Package.swift wiring, no app changes. `continue-on-error: true`
    # and no dependency from any other job: cross-compiling PHP's embed
    # SAPI has known-fragile spots even on a plain macOS build (several
    # long-standing php-src issues), so a red X here must never block an
    # unrelated PR — this is intentionally exploratory, not a gate.
    runs-on: macos-14
    continue-on-error: true
    steps:
      - name: Checkout php-src
        uses: actions/checkout@v4
        with:
          repository: php/php-src
          ref: php-8.4.2
          path: php-src

      - name: Show toolchain versions
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path
          xcrun --sdk iphoneos --show-sdk-version
          clang --version
          autoconf --version || brew install autoconf

      # macos-14 runners ship Apple's own ancient bison (2.3 — kept
      # deliberately outdated for GPLv3 licensing reasons, not a runner
      # misconfiguration), confirmed by this job's own first real CI run
      # ("configure: error: bison 3.0.0 or later is required"). re2c
      # installed alongside pre-emptively for the exact same "known PHP
      # build prerequisite on macOS" reason (Homebrew's own php formula
      # needs both) rather than waiting for a second red run to find it.
      - name: Install bison/re2c (Apple's system bison is too old for PHP)
        run: |
          brew install bison re2c
          echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"

      # This project's own 3rd real run of this job proved a plain
      # `ac_cv_func_posix_spawn_file_actions_addchdir_np=no` env override
      # (tried in an earlier commit) does NOT work here: PHP's own
      # PHP_CHECK_FUNC autoconf macro (build/php.m4) explicitly runs
      # `unset ac_cv_func_$1` before checking, deliberately discarding
      # any pre-seeded cache value — unlike a plain standard-autoconf
      # AC_CHECK_FUNCS, which does honor one. Confirmed straight from
      # that macro's own source, not guessed a second time. Since the
      # cache-variable escape hatch is closed off on purpose, the actual
      # fix has to remove ext/standard/config.m4's own
      # `PHP_CHECK_FUNC(posix_spawn_file_actions_addchdir_np)` call
      # entirely — one line, applied here (not vendored as a permanent
      # source patch, since nothing else in this job keeps php-src
      # checked out between runs) — so the symbol is never even probed,
      # and proc_open.c's own already-portable fork()+exec() fallback
      # compiles instead (the same path taken on any platform where
      # posix_spawn_file_actions_addchdir_np plain doesn't exist at all).
      - name: Patch config.m4 — skip posix_spawn_file_actions_addchdir_np probe (unavailable on iOS)
        working-directory: php-src
        run: |
          sed -i '' 's/AC_CHECK_FUNCS(\[posix_spawn_file_actions_addchdir_np elf_aux_info\])/AC_CHECK_FUNCS([elf_aux_info])/' ext/standard/config.m4
          grep -c "posix_spawn_file_actions_addchdir_np" ext/standard/config.m4 || echo "line removed, 0 occurrences left"

      - name: buildconf (generate ./configure)
        working-directory: php-src
        run: |
          ./buildconf --force

      # --host=aarch64-apple-darwin (not a real "-ios" autoconf triple —
      # autoconf's own triple tables don't know iOS as an OS component)
      # is what actually flips ./configure into cross-compiling mode
      # (host != build); the iOS-specific bits all come from CC/CFLAGS
      # pointing at `xcrun -sdk iphoneos clang` instead. --disable-all
      # + --without-pear + explicitly disabling cli/cgi/phpdbg keeps this
      # first attempt to the smallest possible surface: the one thing
      # under test is whether embed itself links, not whether any
      # extension cross-compiles. Expected to plausibly fail here or at
      # the make step — cross-compiling autoconf-based ./configure
      # scripts normally need a preseeded config.cache for checks that
      # would otherwise try to EXECUTE a target binary on the build
      # host, which this first pass deliberately does not provide yet;
      # the real CI log is the point, not a guess about what it'll say.
      - name: configure (cross-compile for iOS device, arm64)
        working-directory: php-src
        run: |
          export IOS_SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          export CC="xcrun -sdk iphoneos clang -arch arm64"
          export CXX="xcrun -sdk iphoneos clang++ -arch arm64"
          export CFLAGS="-isysroot $IOS_SDK -mios-version-min=15.0"
          export CXXFLAGS="-isysroot $IOS_SDK -mios-version-min=15.0"
          export LDFLAGS="-isysroot $IOS_SDK -mios-version-min=15.0"
          export SQLITE_CFLAGS="-I$IOS_SDK/usr/include"
          export SQLITE_LIBS="-L$IOS_SDK/usr/lib -lsqlite3"
          ./configure \
            --host=aarch64-apple-darwin \
            --disable-all \
            --without-pear \
            --disable-cli \
            --disable-cgi \
            --disable-phpdbg \
            --enable-embed=static \
            --without-pcre-jit \
            --enable-session=static \
            --enable-pdo=static \
            --with-pdo-sqlite=static \
            --with-sqlite3=static \
            --enable-filter=static \
            --enable-mbstring=static \
            --disable-mbregex

      - name: make (embed SAPI only)
        working-directory: php-src
        run: make -j"$(sysctl -n hw.ncpu)" 2>&1 | tail -200

      - name: Check for libphp.a
        working-directory: php-src
        run: |
          find . -name "libphp.a" -exec ls -la {} \;
          test -f libs/libphp.a || (echo "libphp.a not produced" && exit 1)

      - name: Upload libphp.a
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: libphp-ios-arm64-step1
          path: php-src/libs/libphp.a

  php-embed-step2:
    name: "iOS PHP embed — step 2: embed SAPI smoke test (native macOS host)"
    # Step 2 of the same incremental plan step 1 started — see that
    # job's own docblock. Step 1 proved php-src's ./configure + make can
    # produce a libphp.a when cross-compiled for iOS at all; it did NOT
    # prove the embed SAPI's own C API (php_embed_init/zend_eval_string/
    # php_embed_shutdown) actually WORKS the way this project needs it
    # to (running a script string and capturing its output) — an iOS
    # cross-compiled binary can't be executed on this runner (no
    # physical device in CI, and even the simulator target isn't set up
    # yet — that's step 3), so this isolates that separate risk by
    # building the SAME embed SAPI natively for macOS (this runner's own
    # arch/OS — build == host, no cross-compiling at all) and actually
    # RUNNING the result here. Deliberately independent of step1 (own
    # fresh php-src checkout, own build) — a native macOS build has
    # nothing in common with step 1's iOS-specific SDK/sysroot/config.m4
    # patch, so reusing step 1's artifact would test the wrong thing.
    runs-on: macos-14
    continue-on-error: true
    steps:
      - name: Checkout php-src
        uses: actions/checkout@v4
        with:
          repository: php/php-src
          ref: php-8.4.2
          path: php-src

      - name: Install autoconf/bison/re2c (Apple's system bison is too old for PHP)
        run: |
          brew install autoconf bison re2c
          echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"

      - name: buildconf (generate ./configure)
        working-directory: php-src
        run: ./buildconf --force

      # No --host, no CC/CFLAGS override at all — build machine IS the
      # target, so every ./configure check can actually execute a real
      # test binary (the normal, non-cross-compiling autoconf path).
      # --disable-all keeps this to embed only, same reasoning as step1.
      - name: configure (native macOS build, embed SAPI only)
        working-directory: php-src
        run: |
          ./configure \
            --disable-all \
            --without-pear \
            --disable-cli \
            --disable-cgi \
            --disable-phpdbg \
            --enable-embed=static

      - name: make
        working-directory: php-src
        run: make -j"$(sysctl -n hw.ncpu)" 2>&1 | tail -200

      - name: Write embed SAPI smoke test (C)
        working-directory: php-src
        run: |
          cat > embed_smoke_test.c <<'EOF'
          #include <sapi/embed/php_embed.h>

          int main(int argc, char **argv) {
              PHP_EMBED_START_BLOCK(argc, argv)
              zend_eval_string("echo 'hello from embed SAPI';", NULL, "embed_smoke_test");
              PHP_EMBED_END_BLOCK()
              return 0;
          }
          EOF

      # Same include set php-src's own make invocation already used for
      # every ext/ .c file in step 1's real compile log (main/Zend/TSRM/
      # include, plus the source root for generated headers) — no
      # php-config available here (--disable-cli means it's never
      # generated), so these paths are read directly off that known-good
      # invocation rather than guessed fresh.
      - name: Compile + link smoke test against libphp.a
        working-directory: php-src
        run: |
          clang embed_smoke_test.c -o embed_smoke_test \
            -I. -Imain -IZend -ITSRM -Iinclude \
            -DZEND_ENABLE_STATIC_TSRMLS_CACHE=1 \
            libs/libphp.a \
            -lresolv -liconv -lm -lsqlite3

      - name: Run smoke test — expect "hello from embed SAPI" in stdout
        working-directory: php-src
        run: |
          ./embed_smoke_test | tee smoke_output.txt
          grep -q "hello from embed SAPI" smoke_output.txt || (echo "embed SAPI did not produce expected output" && exit 1)

  php-embed-step3:
    name: "iOS PHP embed — step 3: embed SAPI smoke test (iOS Simulator target)"
    # Step 3 combines what step 1 and step 2 each proved separately:
    # step 1 showed the embed SAPI cross-compiles for iOS at all (device
    # target, arm64-apple-ios); step 2 showed the embed SAPI's own C API
    # actually runs correctly (native macOS target). Neither proved both
    # at once — a device-target binary from step 1 cannot run on this
    # runner (no physical iPhone in CI), which is exactly why step 2
    # deliberately used a native build instead of trying to execute
    # step 1's own artifact.
    #
    # The iOS SIMULATOR target closes that gap without needing a real
    # device at all: unlike a device binary, one built for
    # arm64-apple-ios15.0-simulator runs as an ordinary native process
    # directly on this Apple-Silicon runner's own kernel — the whole
    # point of how the Simulator works (same darwin kernel, different
    # SDK/frameworks, no emulation) — so it can just be executed from
    # the shell like step 2's binary was, no xcodebuild/XCTest/simulator
    # boot required for this smoke test specifically. That real Xcode
    # SPM-target wiring (ios/Package.swift, xcodebuild test against a
    # booted simulator) is deferred to a later step, once this raw
    # cross-compiled smoke test itself is proven — same "isolate one
    # variable at a time" reasoning as step 1 vs step 2.
    runs-on: macos-14
    continue-on-error: true
    steps:
      - name: Checkout php-src
        uses: actions/checkout@v4
        with:
          repository: php/php-src
          ref: php-8.4.2
          path: php-src

      - name: Install autoconf/bison/re2c (Apple's system bison is too old for PHP)
        run: |
          brew install autoconf bison re2c
          echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"

      # Same ext/standard/config.m4 patch step 1 needed — applied here
      # too rather than waiting for a red run to confirm it: the iOS
      # Simulator SDK marks posix_spawn_file_actions_addchdir_np
      # unavailable for the same reason the device SDK does (both are
      # "iOS" as far as that availability annotation cares, simulator
      # vs device isn't the axis it's keyed on). MUST run before
      # buildconf, not after — buildconf regenerates ./configure FROM
      # the .m4 sources, so a patch applied afterward has no effect at
      # all on the generated script (confirmed the hard way: this step
      # was originally placed after buildconf here, and the resulting
      # ./configure still probed for and found the symbol, reproducing
      # step 1's exact original failure despite the "successful" sed).
      - name: Patch config.m4 — skip posix_spawn_file_actions_addchdir_np probe (unavailable on iOS)
        working-directory: php-src
        run: |
          sed -i '' 's/AC_CHECK_FUNCS(\[posix_spawn_file_actions_addchdir_np elf_aux_info\])/AC_CHECK_FUNCS([elf_aux_info])/' ext/standard/config.m4

      - name: buildconf (generate ./configure)
        working-directory: php-src
        run: ./buildconf --force

      - name: configure (cross-compile for iOS Simulator, arm64)
        working-directory: php-src
        run: |
          export SIM_SDK=$(xcrun --sdk iphonesimulator --show-sdk-path)
          export CC="xcrun -sdk iphonesimulator clang -arch arm64"
          export CXX="xcrun -sdk iphonesimulator clang++ -arch arm64"
          export CFLAGS="-isysroot $SIM_SDK -mios-simulator-version-min=15.0"
          export CXXFLAGS="-isysroot $SIM_SDK -mios-simulator-version-min=15.0"
          export LDFLAGS="-isysroot $SIM_SDK -mios-simulator-version-min=15.0"
          export SQLITE_CFLAGS="-I$SIM_SDK/usr/include"
          export SQLITE_LIBS="-L$SIM_SDK/usr/lib -lsqlite3"
          ./configure \
            --host=aarch64-apple-darwin \
            --disable-all \
            --without-pear \
            --disable-cli \
            --disable-cgi \
            --disable-phpdbg \
            --enable-embed=static \
            --without-pcre-jit \
            --enable-session=static \
            --enable-pdo=static \
            --with-pdo-sqlite=static \
            --with-sqlite3=static \
            --enable-filter=static \
            --enable-mbstring=static \
            --disable-mbregex

      - name: make
        working-directory: php-src
        run: make -j"$(sysctl -n hw.ncpu)" 2>&1 | tail -200

      - name: Check for libphp.a
        working-directory: php-src
        run: |
          find . -name "libphp.a" -exec ls -la {} \;
          test -f libs/libphp.a || (echo "libphp.a not produced" && exit 1)

      - name: Write embed SAPI smoke test (C)
        working-directory: php-src
        run: |
          cat > embed_smoke_test.c <<'EOF'
          #include <sapi/embed/php_embed.h>

          int main(int argc, char **argv) {
              PHP_EMBED_START_BLOCK(argc, argv)
              zend_eval_string("echo 'hello from embed SAPI (iOS Simulator target)';", NULL, "embed_smoke_test");
              PHP_EMBED_END_BLOCK()
              return 0;
          }
          EOF

      - name: Compile + link smoke test against the Simulator-target libphp.a
        working-directory: php-src
        run: |
          export SIM_SDK=$(xcrun --sdk iphonesimulator --show-sdk-path)
          xcrun -sdk iphonesimulator clang embed_smoke_test.c -o embed_smoke_test \
            -isysroot "$SIM_SDK" -mios-simulator-version-min=15.0 -arch arm64 \
            -I. -Imain -IZend -ITSRM -Iinclude \
            -DZEND_ENABLE_STATIC_TSRMLS_CACHE=1 \
            libs/libphp.a \
            -lresolv -liconv -lm -lsqlite3

      # Two real runs of this job corrected the original plan here: a
      # first attempt tried running the binary directly from the shell
      # (the theory being that a Simulator-target binary is an ordinary
      # native process needing no simulator boot at all) — it DID
      # launch (no "Bad CPU type"/exec failure, so that core idea holds)
      # but failed with "DYLD_ROOT_PATH not set for simulator program".
      # A second attempt set DYLD_ROOT_PATH to the SDK path, which got
      # further but hit "dyld_sim file could not be opened" — the
      # simulator's own dynamic linker shim isn't simply "at the SDK
      # root", and reverse-engineering dyld's exact simulator-launch
      # wiring by guessing more env vars is exactly the kind of blind
      # local guessing this whole incremental plan was meant to avoid.
      # `xcrun simctl spawn` is Apple's own documented, sanctioned way
      # to run a plain command-line binary against a simulator runtime
      # (this is literally its purpose) — it owns all of that dyld
      # wiring internally, so this switches to it instead of fighting
      # dyld directly. Needs one already-booted simulator, hence the
      # boot step first (this runner ships simulator runtimes but starts
      # with none booted).
      - name: Boot an iOS Simulator
        run: |
          UDID=$(xcrun simctl list devices available | grep -m1 "iPhone" | grep -oE '[0-9A-F]{8}-([0-9A-F]{4}-){3}[0-9A-F]{12}')
          echo "SIMULATOR_UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b

      - name: Run smoke test via simctl spawn (owns the dyld_sim wiring)
        working-directory: php-src
        run: |
          xcrun simctl spawn "$SIMULATOR_UDID" "$PWD/embed_smoke_test" | tee smoke_output.txt
          grep -q "hello from embed SAPI" smoke_output.txt || (echo "embed SAPI did not produce expected output" && exit 1)

  php-embed-step4:
    name: "iOS PHP embed — step 4: link smoke test for a real iOS device (build-only)"
    # Step 4 closes the remaining gap between step 1 (proved libphp.a
    # cross-compiles for the iOS DEVICE sysroot) and step 3 (proved the
    # smoke test binary both compiles AND actually runs, but only
    # against the iOS SIMULATOR sysroot, since that's the one target
    # this CI runner can execute without a physical device). This job
    # reruns step 1's own exact device cross-compile, then adds step 3's
    # smoke-test compile+link step against it — but stops there, on
    # purpose: unlike a simulator binary, a device binary is built for
    # real Apple Silicon-in-an-iPhone, not this runner's own arm64
    # macOS kernel, so it cannot be executed here no matter what dyld
    # wiring is attempted (this isn't a Simulator-style "same kernel,
    # different SDK" situation — it's a genuinely different OS/ABI
    # combination, same reason android/README.md's own libphp.so needed
    # a real Android device to actually verify runtime behavior, not
    # just a successful cross-compile). Execution on a real iPhone is a
    # manual step for whoever has one physically in hand, mirroring how
    # this whole repo's own iOS device-only work (RustNativeRenderer's
    # device slice, `-host` LAN testing, etc.) has always been verified.
    runs-on: macos-14
    continue-on-error: true
    steps:
      - name: Checkout php-src
        uses: actions/checkout@v4
        with:
          repository: php/php-src
          ref: php-8.4.2
          path: php-src

      - name: Install autoconf/bison/re2c (Apple's system bison is too old for PHP)
        run: |
          brew install autoconf bison re2c
          echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"

      - name: Patch config.m4 — skip posix_spawn_file_actions_addchdir_np probe (unavailable on iOS)
        working-directory: php-src
        run: |
          sed -i '' 's/AC_CHECK_FUNCS(\[posix_spawn_file_actions_addchdir_np elf_aux_info\])/AC_CHECK_FUNCS([elf_aux_info])/' ext/standard/config.m4

      - name: buildconf (generate ./configure)
        working-directory: php-src
        run: ./buildconf --force

      - name: configure (cross-compile for iOS device, arm64)
        working-directory: php-src
        run: |
          export IOS_SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          export CC="xcrun -sdk iphoneos clang -arch arm64"
          export CXX="xcrun -sdk iphoneos clang++ -arch arm64"
          export CFLAGS="-isysroot $IOS_SDK -mios-version-min=15.0"
          export CXXFLAGS="-isysroot $IOS_SDK -mios-version-min=15.0"
          export LDFLAGS="-isysroot $IOS_SDK -mios-version-min=15.0"
          export SQLITE_CFLAGS="-I$IOS_SDK/usr/include"
          export SQLITE_LIBS="-L$IOS_SDK/usr/lib -lsqlite3"
          ./configure \
            --host=aarch64-apple-darwin \
            --disable-all \
            --without-pear \
            --disable-cli \
            --disable-cgi \
            --disable-phpdbg \
            --enable-embed=static \
            --without-pcre-jit \
            --enable-session=static \
            --enable-pdo=static \
            --with-pdo-sqlite=static \
            --with-sqlite3=static \
            --enable-filter=static \
            --enable-mbstring=static \
            --disable-mbregex

      - name: make
        working-directory: php-src
        run: make -j"$(sysctl -n hw.ncpu)" 2>&1 | tail -200

      - name: Check for libphp.a
        working-directory: php-src
        run: |
          find . -name "libphp.a" -exec ls -la {} \;
          test -f libs/libphp.a || (echo "libphp.a not produced" && exit 1)

      - name: Write embed SAPI smoke test (C)
        working-directory: php-src
        run: |
          cat > embed_smoke_test.c <<'EOF'
          #include <sapi/embed/php_embed.h>

          int main(int argc, char **argv) {
              PHP_EMBED_START_BLOCK(argc, argv)
              zend_eval_string("echo 'hello from embed SAPI (iOS device target)';", NULL, "embed_smoke_test");
              PHP_EMBED_END_BLOCK()
              return 0;
          }
          EOF

      # Build-only, deliberately no run step here — see this job's own
      # docblock for why a device binary can never execute on this
      # runner regardless of how it's invoked.
      - name: Compile + link smoke test against the device-target libphp.a
        working-directory: php-src
        run: |
          export IOS_SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          xcrun -sdk iphoneos clang embed_smoke_test.c -o embed_smoke_test \
            -isysroot "$IOS_SDK" -mios-version-min=15.0 -arch arm64 \
            -I. -Imain -IZend -ITSRM -Iinclude \
            -DZEND_ENABLE_STATIC_TSRMLS_CACHE=1 \
            libs/libphp.a \
            -lresolv -liconv -lm -lsqlite3

      - name: Confirm a real iOS-device Mach-O binary was produced
        working-directory: php-src
        run: file embed_smoke_test

      - name: Upload the device-target smoke test binary + libphp.a
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: embed-smoke-test-ios-device-arm64
          path: |
            php-src/embed_smoke_test
            php-src/libs/libphp.a
