name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  phpunit:
    name: PHPUnit (all packages/*/tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, pdo_sqlite
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: vendor/bin/phpunit

  phpx-smoke-test:
    name: bin/test.sh (phpx smoke test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, pdo_sqlite
          coverage: none
      - run: bash bin/test.sh

  phpstan:
    name: PHPStan (static analysis)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, pdo_sqlite
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: vendor/bin/phpstan analyse

  android-build:
    name: Android APK (assembleDebug)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, pdo_sqlite
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # jniLibs (libphp.so / libsqlite3.so, ~30MB) are committed as-is —
      # see android/README.md — so this is a real APK, native runtime included.
      - run: php bin/phpx bundle:android
      - uses: gradle/actions/setup-gradle@v4
      - run: cd android && gradle :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

  android-e2e-test:
    name: Android E2E (real emulator, android/app/src/androidTest)
    # DISABLED FOR NOW — remove this `if` line to re-enable, once the
    # account's GitHub billing/spending limit is sorted (Settings >
    # Billing and plans). Real root cause, confirmed by a real CI run's
    # own QEMU output — "HVF error: HV_UNSUPPORTED" / "qemu-system-
    # aarch64-headless: failed to initialize HVF: Invalid argument" —
    # is that GitHub's STANDARD macos-14 runner doesn't expose nested
    # virtualization (HVF) to the VM it hands out, so the emulator's own
    # hypervisor init crashes before any emulator-options tuning could
    # ever matter; only the larger `macos-14-xlarge` tier does. That tier
    # is billed at a higher per-minute rate, and this account's own job
    # run came back with "The job was not started because recent account
    # payments have failed or your spending limit needs to be increased"
    # — a GitHub account setting, not anything fixable from workflow code.
    if: false
    # macos-14 (Apple Silicon, ARM64) is required, not ubuntu-latest —
    # android/README.md documents only armeabi-v7a/arm64-v8a builds of
    # libphp.so exist (no x86_64), so a standard Linux runner's x86_64
    # emulator would boot the app straight into "PHP binary not found".
    # An ARM64 system image on Apple Silicon gets real HVF hardware
    # acceleration; the same arch on an Intel/AMD runner would fall back
    # to software emulation, slow enough to blow past any reasonable CI
    # timeout. -xlarge specifically (not plain macos-14): see the `if:
    # false` comment above for why plain macos-14 can never work here.
    runs-on: macos-14-xlarge
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, pdo_sqlite
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: php bin/phpx bundle:android
      - uses: gradle/actions/setup-gradle@v4
      # connectedDebugAndroidTest builds+installs both the app APK and the
      # test APK itself — no separate assembleDebug needed first. Only
      # NativeUiE2ETest.kt's non-@Ignore()'d tests actually run; the two
      # @Ignore()'d ones (drag-to-reorder, horizontal scroll) stay skipped
      # for the documented reason in their own annotations, not silently
      # dropped.
      - name: Run instrumented E2E tests on a real arm64-v8a emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: arm64-v8a
          target: google_apis
          profile: pixel_6
          disable-animations: true
          # A previous theory blamed `-gpu swiftshader_indirect` for the
          # emulator never binding port 5554 and reverted to this
          # action's own default emulator-options — WRONG, disproven by
          # a real CI run's own log: the actual launch command still
          # included `-gpu swiftshader_indirect` regardless (it's this
          # action's DEFAULT, not something the earlier custom
          # `emulator-options:` line was uniquely responsible for), and
          # the real crash was `runs-on`'s runner tier the whole time
          # (see its own comment above) — QEMU's HVF init failing, logged
          # several lines before adb ever gets involved. The boot-timeout
          # bump stays; it's still a strictly additive safety margin.
          emulator-boot-timeout: 900
          script: cd android && gradle :app:connectedDebugAndroidTest

  linux-desktop:
    name: Linux desktop (GTK4/Cairo, python3 -m unittest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, pdo_sqlite
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      # PyGObject/pycairo are system packages tied to the OS's own GTK
      # build (not pip-installable in any portable way) — see
      # linux/README.md.
      - run: sudo apt-get update && sudo apt-get install -y python3-gi python3-gi-cairo gir1.2-gtk-4.0 xvfb
      # Phase 2 proof-of-concept (rust/phpnitro-render/README.md):
      # test_rust_render_parity.py compares this Cairo path's own output
      # against the new Rust core's, pixel by pixel, on real fixtures —
      # it self-skips cleanly if this build step is ever missing, but
      # building it here means CI actually exercises that comparison
      # instead of silently skipping it every run.
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/phpnitro-render
      - run: cargo build --release --locked
        working-directory: rust/phpnitro-render
      # Confirmed by a real CI run: running with NO display backend at
      # all (not even Xvfb) segfaulted partway through
      # test_app_widget.py's animation-timer test — a real, reproducible
      # crash in CI, even though the exact same suite ran clean, many
      # times, in the sandbox this target was originally written in
      # (which also has no Xvfb — see linux/README.md). The two
      # environments' GTK4/PyGObject package versions aren't identical,
      # so the honest state is: root-caused to "no display at all is an
      # unsupported GTK4 configuration that's unstable in at least one
      # of these two environments," not nailed down further than that.
      # xvfb-run was already a dependency for the smoke test below;
      # wrapping the whole suite in it is the same real (virtual)
      # display every actual Linux desktop this app would ever run on
      # already has — the crash-free configuration, not a workaround
      # papering over one.
      - run: xvfb-run -a python3 -m unittest discover -s linux/tests -v
      # The one thing that could never be checked without a real display
      # server (none available in the environment this target was
      # originally written in — see linux/README.md's own note on that):
      # does a real Gtk.Application + Gtk.ApplicationWindow actually
      # come up at all, end to end, against this repo's own real PHP
      # server. xvfb-run supplies a virtual X server so this is a REAL
      # window, not a mock — just an invisible one.
      - name: Real windowed smoke test (Xvfb) — app launches and stays alive
        working-directory: linux
        run: |
          set -e
          xvfb-run -a python3 -m phpnitro_desktop .. --screen home &
          APP_PID=$!
          sleep 5
          if ! kill -0 "$APP_PID" 2>/dev/null; then
            echo "::error::phpnitro_desktop exited/crashed within 5s of launch instead of staying open"
            exit 1
          fi
          echo "phpnitro_desktop is alive after 5s (PID $APP_PID) — real window + real PHP fetch didn't crash"
          kill "$APP_PID"
          wait "$APP_PID" 2>/dev/null || true

  ios-build:
    name: iOS Swift package (xcodebuild, PhpNitroNativeEngine)
    # No .xcodeproj is committed — Xcode has built raw SPM packages
    # directly by scheme name since Xcode 11, so `xcodebuild -scheme
    # <target>` against a bare Package.swift works with nothing to
    # generate first. See ios/README.md: PhpNitroWebViewBridge (the
    # older WKWebView fallback path) and PhpNitroNativeEngine (this
    # framework's actual primary render pipeline, ported for the first
    # time here) are two separate targets — this job builds+tests the
    # one with real unit tests today; PhpNitroWebViewBridge has none yet
    # (it has never run against a real WKWebView either, see its own
    # docblocks), so it's built here (catches compile errors) but not
    # tested.
    runs-on: macos-14
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4
      - run: xcodebuild -scheme PhpNitroWebViewBridge -destination 'generic/platform=iOS Simulator' build
      # Confirmed by a real CI run's `xcodebuild -list` output (three
      # wrong guesses before this one — "PhpNitroNativeEngine" exists but
      # isn't wired for the Test action; bare "PhpNitroEngine" doesn't
      # exist as a scheme at all; "PhpNitroNativeEngineTests" doesn't
      # either): Xcode's actual auto-generated schemes for this package
      # are "PhpNitroEngine-Package", "PhpNitroNativeEngine", and
      # "PhpNitroWebViewBridge" — the package-level aggregate scheme
      # (which IS wired for Test, running every test target including
      # PhpNitroNativeEngineTests) gets a "-Package" suffix Xcode never
      # documents up front, it only shows up in -list's real output.
      - run: xcodebuild -scheme PhpNitroEngine-Package -destination 'platform=iOS Simulator,name=iPhone 15' test

  macos-build:
    name: macOS Swift package (xcodebuild, PhpNitroMacEngine)
    # A genuinely SEPARATE package from ios/ (macos/Package.swift, with a
    # local path dependency on ios/'s own PhpNitroProtocol product) — see
    # that manifest's own docblock for why: ios/'s aggregate `-Package`
    # scheme (the one wired for the Test action, per ios-build's own
    # comment above) would try to build EVERY target in that package for
    # macOS, including UIKit-only ones, and fail. A separate package
    # means this job can never touch iOS-only code at all.
    runs-on: macos-14
    defaults:
      run:
        working-directory: macos
    steps:
      - uses: actions/checkout@v4
      # Homebrew is preinstalled on GitHub's macOS runners — this
      # downloads over GitHub's own network (the CI runner's), never the
      # machine that queued this workflow. Needed for
      # MacPhpProcessTests' real spawn-a-server integration test (mirrors
      # linux/tests/test_php_process.py's own real `php -S` test); that
      # specific test skips itself gracefully (XCTSkip) if this step
      # were ever removed or `php` weren't actually on PATH afterward,
      # so this isn't a hard requirement for the rest of the suite.
      - run: brew install php
      # rust/phpnitro-render, compiled NATIVELY for this runner's own
      # macOS/arm64 host (no cross-compilation toolchain needed at all —
      # unlike Android/iOS, this CI runner's own architecture already IS
      # the target). RustMacRenderer's linker flags (see macos/Package.swift's
      # own #filePath-computed rustReleaseDir) expect this exact
      # target/release/ path to exist before xcodebuild links anything
      # against it.
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/phpnitro-render
      - run: cargo build --release --locked
        working-directory: rust/phpnitro-render
      # This package's scheme names have never been confirmed against a
      # real `xcodebuild -list` since RustMacRenderer/CPhpNitroRender were
      # added — logged up front specifically so a wrong guess below is a
      # two-second diagnosis from the log instead of a mystery. This
      # package now has 2 products (PhpNitroMacEngine, RustMacRenderer),
      # not 1 — per ios-build's own precedent (4 products there), Xcode
      # is therefore expected to generate a "PhpNitroMacEngine-Package"
      # aggregate scheme (wired for the Test action) alongside per-target
      # build-only ones, NOT keep the old single-scheme-no-suffix
      # behavior this job's previous comment (see git history) documented
      # for the 1-product package that existed before this commit.
      - run: xcodebuild -list
      - run: xcodebuild -scheme PhpNitroMacEngine -destination 'platform=macOS' build
      - run: xcodebuild -scheme RustMacRenderer -destination 'platform=macOS' build
      - run: xcodebuild -scheme PhpNitroMacEngine-Package -destination 'platform=macOS' test

  windows-desktop-protocol:
    name: Windows desktop protocol layer (dotnet test)
    # Runs on ubuntu-latest, deliberately — windows/PhpNitroDesktop.Protocol
    # targets plain net8.0, no Windows-specific API anywhere in it (see
    # windows/README.md for the full reasoning: no .NET/C# toolchain was
    # available while writing this, so only the platform-agnostic slice
    # was attempted at all, mirroring ios/'s own PhpNitroProtocol). This
    # job running at all, on Linux, is real proof of that claim — not
    # just a comment saying so.
    #
    # PhpNitroDesktop.Render (P/Invoke bindings for rust/phpnitro-render's
    # C ABI) is the same story one level deeper: .NET's DllImport
    # resolution is itself cross-platform, so running its tests here
    # against the Linux-built libphpnitro_render.so is real evidence the
    # same C# code would resolve phpnitro_render.dll on an actual Windows
    # machine too — not just an untested claim, the same rigor as the
    # Protocol layer above.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, pdo_sqlite
          coverage: none
      - run: composer install --no-interaction --prefer-dist
        working-directory: .
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/phpnitro-render
      - run: cargo build --release --locked
        working-directory: rust/phpnitro-render
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet test PhpNitroDesktop.Protocol.Tests --verbosity normal
      - run: dotnet test PhpNitroDesktop.Render.Tests --verbosity normal

  rust-render-core:
    name: Rust shared render core (cargo test, phpnitro-render)
    # rust/phpnitro-render is the future single rendering engine meant to
    # replace the 4 separately-written native renderers (Android/iOS+macOS/
    # Linux/Windows) — see rust/phpnitro-render/README.md. This job only
    # exercises the crate itself (protocol decoding, rasterization, hit-
    # testing, animation math) offscreen via tiny-skia's Pixmap, the same
    # no-display-server approach linux/tests already uses with Cairo's
    # ImageSurface — unlike the linux-desktop job below, this one needs no
    # Xvfb at all, since nothing here ever opens a real window.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust/phpnitro-render
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust/phpnitro-render
      - run: cargo test --locked --verbose
