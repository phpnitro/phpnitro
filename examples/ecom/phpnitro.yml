name: Ma Boutique
description: Boutique en ligne de démonstration complète du framework PhpNitro
version: 1.0.0
php: ">=8.1"

# Icône du launcher Android générée depuis ce PNG carré (placeholder — à
# remplacer par un vrai logo, il suffit de changer le chemin) par
# bundle-android.sh via ../../bin/generate-android-icon.php.
icon: assets/icon.png
icon_background: "#059669"

# Documentation seule ici (cet exemple n'utilise pas bin/phpx) — voir
# CheckoutPage::build() pour l'ordre de priorité réel entre gateways, et
# ../../README.md#paiement pour le détail de chacun. Renseigne l'une de ces
# paires dans .env pour l'activer sur /checkout.
payments:
    kkiapay:
        public_key_env: KKIAPAY_PUBLIC_KEY
        secret_key_env: KKIAPAY_PRIVATE_KEY
    stripe:
        public_key_env: STRIPE_PUBLIC_KEY
        secret_key_env: STRIPE_SECRET_KEY
    paypal:
        public_key_env: PAYPAL_CLIENT_ID
        secret_key_env: PAYPAL_CLIENT_SECRET
    fedapay:
        public_key_env: FEDAPAY_PUBLIC_KEY
        secret_key_env: FEDAPAY_SECRET_KEY
    feexpay:
        public_key_env: FEEXPAY_SHOP_ID
        secret_key_env: FEEXPAY_API_KEY
    izichangepay:
        public_key_env: IZICHANGEPAY_API_KEY
        secret_key_env: IZICHANGEPAY_API_SECRET
    tresorpay:
        public_key_env: TRESORPAY_PUBLIC_KEY
        secret_key_env: TRESORPAY_SECRET_KEY

# Engine\Maps\MapView::make() (utilisé sur /product/{id} pour le retrait en
# magasin) choisit le premier fournisseur configuré ici ; OpenStreetMap n'a
# pas besoin d'entrée, c'est le repli toujours disponible sans clé.
maps:
    mapbox:
        access_token_env: MAPBOX_ACCESS_TOKEN
    google:
        api_key_env: GOOGLE_MAPS_API_KEY
