android.useAndroidX=true
kotlin.code.style=official
# Release builds (R8 minification, lintVital) need more than the default
# 512m — assembleRelease was OOM-crashing both :go:minifyReleaseWithR8
# and :engine:lintVitalAnalyzeRelease on this machine's default heap.
org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=1024m
