name: HostApp
options:
  bundleIdPrefix: com.phpnitro.hostapp
  deploymentTarget:
    iOS: "15.0"
settings:
  base:
    # Real device build/run (2026-09-09, first iPhone available for this
    # project — an 11 Pro Max) needs a real signing identity; simulator
    # builds never read these. Team ID recovered from the embedded
    # provisioning profile Xcode itself generated the first time this
    # was signed via the GUI's own Signing & Capabilities picker (the
    # only way that actually surfaced the right team — `xcodebuild
    # -allowProvisioningUpdates` alone never auto-selected one, and a
    # DIFFERENT, stale keychain certificate's team (WA4FYZ452J, this
    # file's own first guess) produced "No Account for Team X" instead).
    # Pinning it here so a future `xcodegen generate` doesn't wipe out a
    # team choice made by hand in the Xcode GUI again.
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: KGV44Q59VW
packages:
  PhpNitroEngine:
    path: ..
targets:
  HostApp:
    type: application
    platform: iOS
    sources:
      - HostApp
    dependencies:
      - package: PhpNitroEngine
        product: PhpNitroNativeEngine
    info:
      path: HostApp/Info.plist
      properties:
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        # device:applink (Engine\Device\AppLinks) — AppDelegate's own
        # recordAppLink(_:) calls only ever fire for a URL matching a
        # scheme this app has actually registered.
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - phpnitro
        # Required at BUILD time for contactsCount()/upcomingEventsCount()
        # (NativeDeviceBridge.swift) to not crash on an actual fetch once
        # authorized — Android's own contactsCount()/upcomingEventsCount()
        # only ever CHECK permission, never request it, but iOS crashes
        # outright on a real CNContactStore/EKEventStore access with no
        # usage-description string present at all, authorized or not.
        NSContactsUsageDescription: "Compte les contacts pour la démo NativeDeviceBridge — lecture seule."
        NSCalendarsUsageDescription: "Compte les événements à venir pour la démo NativeDeviceBridge — lecture seule."
        # Required at BUILD time for bluetoothState() (NativeDeviceBridge.swift)
        # to not crash the instant a CBCentralManager is created at all,
        # even just to read state — unlike the CN/EK stores above, this
        # crash isn't gated on the check actually running past
        # authorization, it happens at CBCentralManager.init() itself.
        NSBluetoothAlwaysUsageDescription: "Lit l'état du Bluetooth pour la démo NativeDeviceBridge."
        # Same "required at build time even for a check-only permission
        # request" constraint as Contacts/Calendar above — the "permission"
        # bridge's own camera/microphone/location branches
        # (NativeDeviceBridge.swift's requestPermission()) crash without
        # these present, granted or not.
        NSCameraUsageDescription: "Démo de demande de permission caméra (NativeDeviceBridge)."
        NSMicrophoneUsageDescription: "Démo de demande de permission microphone (NativeDeviceBridge)."
        NSLocationWhenInUseUsageDescription: "Démo de demande de permission de localisation (NativeDeviceBridge)."
        # Face ID (not Touch ID) is the one biometric mode that crashes
        # without a usage description at all — Fingerprint::authenticateAction()'s
        # authenticateBiometric() below.
        NSFaceIDUsageDescription: "Confirme ton identité pour la démo NativeDeviceBridge."
        # device:bgschedule — BGTaskScheduler refuses to register/submit
        # a task whose identifier isn't declared here, and "fetch" is
        # the background mode that actually lets the OS wake this app
        # to run it at all.
        BGTaskSchedulerPermittedIdentifiers:
          - com.phpnitro.hostapp.ping
        UIBackgroundModes:
          - fetch
        # NFCReaderUsageDescription + the CoreNFC entitlement/capability
        # deliberately NOT declared here: Apple restricts "NFC Tag
        # Reading" to a paid Apple Developer Program membership — a
        # Personal (free) team, the one this project builds with, gets
        # a real build failure the moment that capability is requested
        # ("Personal development teams... do not support the NFC Tag
        # Reading capability"), confirmed on this exact device
        # (2026-09-10). startNfcListening()/stopNfcListening() in
        # NativeDeviceBridge.swift stay real and correct, ready for
        # this to come back the moment a paid membership is available —
        # NFCNDEFReaderSession.readingAvailable would also just report
        # false without the entitlement even if this were re-added, so
        # nothing about the Swift code itself needs to change.
        # Makes this app's own Documents directory (where saveFile()
        # below writes) browsable from the Files app — the closest iOS
        # gets to Android's own MediaStore.Downloads visibility.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        # Alternate icon for device:appicon:alt (Engine\Device\DynamicIcon,
        # "Icône bleue" in NativeDeviceScreen.php) — NativeDeviceBridge.swift's
        # setAppIcon() calls UIApplication.setAlternateIconName("alt"), which
        # looks this key up here. A loose PNG (HostApp/AppIcon-Alt.png), not
        # an asset-catalog entry — alternate icons predate Xcode's asset
        # catalog support for them and this is still the form XcodeGen's own
        # plain Info.plist properties can express directly.
        CFBundleIcons:
          CFBundleAlternateIcons:
            alt:
              CFBundleIconFiles:
                - AppIcon-Alt
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.phpnitro.hostapp
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  HostAppUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - HostAppUITests
    dependencies:
      - target: HostApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.phpnitro.hostapp.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: HostApp
  GoHostApp:
    type: application
    platform: iOS
    sources:
      - GoHostApp
    dependencies:
      - package: PhpNitroEngine
        product: PhpNitroGo
    info:
      path: GoHostApp/Info.plist
      properties:
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSCameraUsageDescription: "Scanner le QR code affiché par phpx serve."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.phpnitro.gohostapp
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  GoHostAppUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - GoHostAppUITests
    dependencies:
      - target: GoHostApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.phpnitro.gohostapp.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: GoHostApp
schemes:
  HostApp:
    build:
      targets:
        HostApp: all
        HostAppUITests: [test]
    test:
      targets:
        - HostAppUITests
  GoHostApp:
    build:
      targets:
        GoHostApp: all
        GoHostAppUITests: [test]
    test:
      targets:
        - GoHostAppUITests
