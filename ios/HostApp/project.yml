name: HostApp
options:
  bundleIdPrefix: com.phpnitro.hostapp
  deploymentTarget:
    iOS: "15.0"
settings:
  base:
    # Real device build/run (2026-09-09, first iPhone available for this
    # project — an 11 Pro Max) needs a real signing identity; simulator
    # builds never read these. Team ID recovered from the embedded
    # provisioning profile Xcode itself generated the first time this
    # was signed via the GUI's own Signing & Capabilities picker (the
    # only way that actually surfaced the right team — `xcodebuild
    # -allowProvisioningUpdates` alone never auto-selected one, and a
    # DIFFERENT, stale keychain certificate's team (WA4FYZ452J, this
    # file's own first guess) produced "No Account for Team X" instead).
    # Pinning it here so a future `xcodegen generate` doesn't wipe out a
    # team choice made by hand in the Xcode GUI again.
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: KGV44Q59VW
packages:
  PhpNitroEngine:
    path: ..
targets:
  HostApp:
    type: application
    platform: iOS
    sources:
      - HostApp
    dependencies:
      - package: PhpNitroEngine
        product: PhpNitroNativeEngine
    info:
      path: HostApp/Info.plist
      properties:
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.phpnitro.hostapp
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  HostAppUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - HostAppUITests
    dependencies:
      - target: HostApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.phpnitro.hostapp.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: HostApp
  GoHostApp:
    type: application
    platform: iOS
    sources:
      - GoHostApp
    dependencies:
      - package: PhpNitroEngine
        product: PhpNitroGo
    info:
      path: GoHostApp/Info.plist
      properties:
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSCameraUsageDescription: "Scanner le QR code affiché par phpx serve."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.phpnitro.gohostapp
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  GoHostAppUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - GoHostAppUITests
    dependencies:
      - target: GoHostApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.phpnitro.gohostapp.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: GoHostApp
schemes:
  HostApp:
    build:
      targets:
        HostApp: all
        HostAppUITests: [test]
    test:
      targets:
        - HostAppUITests
  GoHostApp:
    build:
      targets:
        GoHostApp: all
        GoHostAppUITests: [test]
    test:
      targets:
        - GoHostAppUITests
